version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: ragfury-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ragfury-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ragfury-postgres:
    image: postgres:16
    container_name: ragfury-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ragfury_checkpoints
      POSTGRES_USER: ragfury_user
      POSTGRES_PASSWORD: ragfury_password

    ports:
      - "5433:5432"

    volumes:
      - ragfury_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragfury_user -d ragfury_checkpoints"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  qdrant_data:
  ragfury_postgres_data:
