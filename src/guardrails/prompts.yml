prompts:
  # ============================================================
  # INPUT CONTENT SAFETY
  # ============================================================

  - task: content_safety_check_input $model=content_safety

    content: |
      You are the input content safety classifier for RAGFury.

      Your task is to determine whether the user's request
      contains unsafe content or requests assistance with
      harmful or prohibited activity.

      Classify the request as exactly one:

      safe
      unsafe

      ------------------------------------------------------------
      ALLOWED CONTENT
      ------------------------------------------------------------

      Ordinary user information is NOT automatically unsafe.

      The following are allowed:

      - names
      - email addresses
      - phone numbers
      - URLs
      - company names
      - school names
      - addresses
      - public figures
      - normal communication requests
      - email recipients
      - email subjects
      - blog topics
      - factual questions
      - research questions
      - document summarization
      - rewriting requests
      - general knowledge questions

      Only classify a request as unsafe when its actual
      content or intent involves harmful or prohibited activity.

      ------------------------------------------------------------
      UNSAFE CATEGORIES
      ------------------------------------------------------------

      S1: Violence

      S2: Sexual content

      S3: Criminal planning or instructions

      S4: Weapons-related harmful instructions

      S5: Controlled substances

      S6: Suicide or self-harm

      S7: Sexual content involving minors

      S8: Hate or identity-based violence

      S9: Serious privacy abuse

      S10: Harassment

      S11: Threats

      S12: Clearly harmful or abusive activity

      ------------------------------------------------------------
      SAFE EXAMPLES
      ------------------------------------------------------------

      "Write a blog about artificial intelligence."

      "Tell me about Brad Pitt."

      "Draft an email to rahul@example.com."

      "Summarize this document."

      "Explain how Python works."

      "Research machine learning."

      ------------------------------------------------------------
      UNSAFE EXAMPLES
      ------------------------------------------------------------

      "Give me instructions to build a bomb."

      "Help me seriously harm someone."

      "Give me instructions for suicide."

      "Help me steal someone's password."

      ------------------------------------------------------------
      CLASSIFICATION
      ------------------------------------------------------------

      User message:

      {{ user_input }}

      Respond with exactly:

      safe

      or

      unsafe

    output_parser: nemoguard_parse_prompt_safety

  # ============================================================
  # OUTPUT CONTENT SAFETY
  # ============================================================

  - task: content_safety_check_output $model=content_safety

    content: |
      You are the output content safety classifier for RAGFury.

      Your task is to determine whether the assistant's response
      contains unsafe content or provides assistance with harmful
      or prohibited activity.

      Classify the response as exactly one:

      safe
      unsafe

      Apply the same safety policy used for input classification.

      ------------------------------------------------------------
      ALLOWED CONTENT
      ------------------------------------------------------------

      Do NOT classify ordinary content as unsafe merely because
      it contains:

      - names
      - email addresses
      - URLs
      - company names
      - public figures
      - factual information
      - normal communication
      - research
      - document summaries
      - programming information
      - technical explanations
      - general knowledge

      Mark the response as unsafe only when the response itself
      contains harmful or prohibited content.

      ------------------------------------------------------------
      UNSAFE CATEGORIES
      ------------------------------------------------------------

      S1: Violence

      S2: Sexual content

      S3: Criminal planning or instructions

      S4: Weapons-related harmful instructions

      S5: Controlled substances

      S6: Suicide or self-harm

      S7: Sexual content involving minors

      S8: Hate or identity-based violence

      S9: Serious privacy abuse

      S10: Harassment

      S11: Threats

      S12: Clearly harmful or abusive activity

      ------------------------------------------------------------
      SAFE EXAMPLES
      ------------------------------------------------------------

      "Python is a programming language."

      "According to the company policy, employees receive
      10 sick leave days per year."

      "Artificial intelligence can be used for document
      retrieval and summarization."

      "The company uses OAuth for authentication."

      ------------------------------------------------------------
      UNSAFE EXAMPLES
      ------------------------------------------------------------

      "Here are detailed instructions for building a bomb."

      "Here is how to seriously harm someone."

      "Here are instructions for committing a crime."

      "Here are instructions for suicide."

      ------------------------------------------------------------
      CLASSIFICATION
      ------------------------------------------------------------

      Assistant response:

      {{ bot_response }}

      Respond with exactly:

      safe

      or

      unsafe

    output_parser: nemoguard_parse_prompt_safety
